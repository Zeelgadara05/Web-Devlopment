<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - StudentHub Portal</title>
    <link rel="stylesheet" href="CSS/registration.css?v=2">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Student Registration</h1>
        </header>

        <div class="form-container">
            <div class="form-header">
                <h2>Create Your Account</h2>
            </div>
            <div class="form-body">
                <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

                <form id="registrationForm" method="POST" action="php/register_process.php" novalidate>
                    <div class="form-group">
                        <label for="fullname">Full Name *</label>
                        <input type="text" id="fullname" name="fullname" maxlength="50"
                               autocomplete="name" placeholder="e.g. Rahul Sharma" required>
                        <span class="error-message" id="fullnameError" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="rollNo">Username / Roll Number <small>(optional — auto-generated if blank)</small></label>
                        <input type="text" id="rollNo" name="rollNo" placeholder="e.g. CS21009" maxlength="15"
                               autocomplete="username" inputmode="text">
                        <span class="field-hint">This is your login username. Leave blank to generate one automatically.</span>
                        <span class="error-message" id="rollNoError" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" maxlength="150"
                               autocomplete="email" placeholder="e.g. rahul.sharma@charusat.edu" required>
                        <span class="error-message" id="emailError" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number *</label>
                        <input type="tel" id="mobile" name="mobile" maxlength="10"
                               autocomplete="tel" inputmode="numeric" placeholder="10-digit number" required>
                        <span class="error-message" id="mobileError" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" minlength="8"
                               autocomplete="new-password"
                               placeholder="At least 8 characters with a number and special character" required>
                        <span class="field-hint">Use at least 8 characters with a letter, a number and a special character (@$!%*#?&amp;).</span>
                        <span class="error-message" id="passwordError" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirmpassword">Confirm Password *</label>
                        <input type="password" id="confirmpassword" name="confirmpassword" minlength="8"
                               autocomplete="new-password" placeholder="Re-enter your password" required>
                        <span class="error-message" id="confirmpasswordError" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="course">Course *</label>
                        <select id="course" name="course" required>
                            <option value="">Select Course</option>
                            <option value="B.Tech">B.Tech</option>
                            <option value="M.Tech">M.Tech</option>
                            <option value="BCA">BCA</option>
                            <option value="MCA">MCA</option>
                        </select>
                        <span class="error-message" id="courseError" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="department">Department <small>(optional)</small></label>
                        <select id="department" name="department">
                            <option value="">Select Department</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                            <option value="Information Technology">Information Technology</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="year">Year *</label>
                        <select id="year" name="year" required>
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                        <span class="error-message" id="yearError" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label>Gender *</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="gender" value="Male" required> Male
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="gender" value="Female" required> Female
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="gender" value="Other" required> Other
                            </label>
                        </div>
                        <span class="error-message" id="genderError" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="terms" name="terms" required>
                            <label for="terms">I accept the Terms and Conditions *</label>
                        </div>
                        <span class="error-message" id="termsError" aria-live="polite"></span>
                    </div>

                    <button type="submit" class="btn-submit" id="registerButton">Register Now</button>
                </form>

                <p style="margin-top: 20px; text-align: center;">
                    <a href="login.html">Already have an account? Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="JS/Registration.js?v=7"></script>
</body>
</html>
